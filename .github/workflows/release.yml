# Publish @mega-yfue/eufy-sdk.
#
# Two triggers: a published GitHub Release on tag vX.Y.Z ships to `latest`, and a push to a
# `beta-X.Y.Z` / `alpha-X.Y.Z` branch ships a prerelease to that channel.
#
# ── One registry: npmjs ─────────────────────────────────────────────────────────────────────────
# Every channel publishes to npmjs, public, with provenance. The repository is public, so the built
# library and the source it is built from are readable by the same people, and a second registry would
# only be a second place for the same tarball to be out of date.
#
# ── The REF names the version, on all three channels ────────────────────────────────────────────
# The tag `v1.2.3` publishes 1.2.3; the branch `beta-1.2.3` publishes 1.2.3-beta.N. package.json's
# committed version is never what ships and is not consulted — releasing is `git tag`, never a bump
# commit.
#
# The alternative, publishing whatever package.json holds, needs the bump committed BEFORE the tag
# and has nothing tying the two together: tag v0.1.0 with package.json still on 0.0.5 and 0.0.5 ships,
# silently, under a release page that says 0.1.0. That is not a mistake worth being able to make here,
# because immutable releases (below) mean it costs two version numbers — the tag's and the one
# published by accident. Deriving from the ref removes the failure instead of checking for it.
#
# A prerelease branch takes the base version from its OWN NAME and appends a prerelease suffix
# (`beta-1.2.3` → 1.2.3-beta.0, .1, … on each push). Nothing is committed back — the bump is local to
# the runner, so the branch name stays the single source of the base version and cannot drift from
# package.json the way a committed bump would.
#
# The counter therefore has to come from somewhere, and the registry is the only place that knows it:
# nothing is committed, so package.json still says the base version on every run. Deriving the suffix
# locally would republish `-beta.0` forever and every push after the first would fail on an
# already-published version. So the step below reads the registry's VERSION LIST, takes the highest N
# already published for THIS base on this channel, and adds one. The registry being the state is also
# what makes a re-run of a failed job correct rather than a duplicate.
#
# The channel's dist-tag is NOT the counter, because one dist-tag serves every base: a single push to
# `beta-0.1.1` moves `beta` to 0.1.1-beta.0, and from then on every push to a still-open `beta-0.1.0`
# reads a base that is not its own, falls back to "first prerelease of 0.1.0", and 409s on
# 0.1.0-beta.0 forever. Per-base, from the version list, there is no shared cursor to hijack.
#
# ── Credentials: no token is stored ─────────────────────────────────────────────────────────────
# There is no NPM_TOKEN. The runner mints a short-lived OIDC identity that npm verifies against the
# trusted publisher configured on the package (npmjs.com → the package → Settings → Trusted
# publishers), which pins three things that must all keep matching: this repository, this workflow's
# FILENAME, and the `release` environment. Rename this file or drop the `environment:` key below and
# publishing stops working — the failure looks like an auth error, not a config error.
#
# Nothing long-lived is stored in this repo, so there is no token to leak, rotate, or expire. It
# requires npm ≥ 11.5.1, which is why the toolchain npm is upgraded below, and `id-token: write` in
# the permissions block.
#
# A package's very first publish cannot use this path: npm has no way to pre-register a trusted
# publisher for a name that does not exist yet, so the trust is configured against an existing
# package.
#
# ── A failed release burns its version number, permanently ──────────────────────────────────────
# Immutable releases are on. A tag that has ever belonged to a release cannot be reused, even after
# the release and the tag are both deleted — GitHub answers `tag_name was used by an immutable
# release` and there is no way back. The same feature is why a release tag cannot be pushed or moved
# with git; it has to be created through the release flow.
#
# So a release that fails partway is never retried on the same number: fix forward, bump, and cut a
# new one. That is what makes running `npm run verify` in this job worth the duplication with CI — a
# gate failing here costs a version number, and there is no second attempt at it.
#
# `--provenance` publishes a signed attestation linking the tarball to this workflow run and commit,
# which npm shows on the package page. It needs the same `id-token: write`.
#
# ── Actions pinned to full-length commit SHAs ───────────────────────────────────────────────────
# A tag is mutable — the action's owner can move `v7` onto different code and this workflow would run
# it, here, with publish rights in scope. A SHA makes an update a reviewable diff. Dependabot rewrites
# the SHA and the trailing `# vX.Y.Z` comment together.
name: Release

on:
  release:
    types: [published]
  # Every push to a prerelease branch ships an installable X.Y.Z-beta.N, so a fix under review is
  # something a consumer can pull rather than a commit they have to build.
  push:
    branches:
      - beta-*.*.*
      - alpha-*.*.*

# `contents: read` — the release notes are written by hand on the GitHub Release, not generated here.
# `id-token: write` is npm's OIDC.
permissions:
  id-token: write
  contents: read

# Never cancel an in-flight publish: a killed job can leave the registry half-updated.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A fork must not publish, and a GitHub Release flagged `prerelease` must not land on the `latest`
    # dist-tag — use a beta/alpha branch for that instead.
    if: >-
      github.repository == 'mega-yfue/eufy-sdk'
      && !(github.event_name == 'release' && github.event.release.prerelease)
    runs-on: ubuntu-latest
    # REQUIRED, not decorative: the npm trusted publisher is configured with the environment name, so
    # the OIDC token has to carry a matching `environment` claim or npm rejects the publish. Removing
    # this key does not loosen the workflow, it breaks it — and each name below needs its own trusted
    # publisher entry on the package (npm allows several; the repository and workflow FILENAME are the
    # same on both).
    #
    # Which environment depends on what a failure costs. A tag is a stable version that can never be
    # withdrawn or reused, so `release` requires a review from one of the three maintainers and forbids
    # self-review: whoever cuts the release is not the one who approves it, and the job pauses until
    # someone else clicks approve. A prerelease costs one `-beta.N`, so `prerelease` has no reviewer at
    # all and publishes on push.
    #
    # A branch cannot reach `release` and a tag cannot reach `prerelease`: each environment's deployment
    # branch policy admits only its own refs, so the gate does not depend on this expression being
    # right.
    environment:
      name: ${{ startsWith(github.ref, 'refs/heads/') && 'prerelease' || 'release' }}
      url: https://www.npmjs.com/package/@mega-yfue/eufy-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1, which Node 24.5.0 already bundles. The version is
      # pinned to the one CI runs, so the release installs from the lock the way CI verified it.
      #
      # The assertion is the point of the step. An npm below the floor fails publishing as an
      # authentication error several steps later, with nothing pointing at the cause; this names it.
      - name: Ensure npm can do OIDC
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          need=11.5.1
          have="$(npm --version)"
          # sort -V puts the lower version first; if that is not `need`, then have < need.
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "::error::npm $have is below the $need floor for OIDC trusted publishing"
            exit 1
          fi
          echo "npm $have — OIDC capable"

      - name: Install dependencies
        run: npm ci

      # The same gate CI runs. A release is the one place where skipping it is unrecoverable: an npm
      # version cannot be re-published, only deprecated.
      - name: Verify (npm run verify)
        run: npm run verify

      - name: Resolve the release channel
        id: channel
        run: |
          case "${{ github.ref }}" in
            refs/heads/beta-*)  echo "tag=beta"   >> "$GITHUB_OUTPUT" ;;
            refs/heads/alpha-*) echo "tag=alpha"  >> "$GITHUB_OUTPUT" ;;
            *)                  echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # `beta-1.2.3` → 1.2.3-beta.N, where N continues from the highest 1.2.3-beta.* already on the
      # registry rather than restarting at 0 on every push (see the header). Per-base and not from the
      # `beta` dist-tag, which one push to a different beta branch is enough to point elsewhere.
      #
      # --no-git-tag-version keeps all of it local to the runner: nothing is committed or tagged.
      - name: Apply the prerelease version
        if: steps.channel.outputs.tag != 'latest'
        env:
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail
          base="${GITHUB_REF_NAME#*-}"
          name="$(npm pkg get name --workspaces=false | tr -d '"')"
          # `versions` is a packument field, so it lists every version regardless of which one the
          # spec resolves to — but a spec there must be: bare `npm view <name> <field>` means
          # `@latest`, which every published package has.
          #
          # A brand-new package prints an empty string rather than failing — hence the `|| true`.
          versions="$(npm view "$name" versions --json 2>/dev/null || true)"

          # Highest N among this base's prereleases on this channel; empty when there are none, which
          # `${n:--1} + 1` turns into the first, `.0`.
          n="$(printf '%s' "$versions" | tr -d '[]" ' | tr ',' '\n' \
            | sed -n "s/^${base//./\\.}-$TAG\.\([0-9]\{1,\}\)$/\1/p" | sort -n | tail -1)"

          npm version "$base-$TAG.$(( ${n:--1} + 1 ))" --no-git-tag-version --allow-same-version
          echo "publishing $(npm pkg get version | tr -d '"') to the $TAG channel"

      # `v1.2.3` → publish 1.2.3. The tag is the version, so a release is a tag and nothing else — no
      # bump commit to remember, and no way for the number on the release page to disagree with the
      # number on npm.
      #
      # The regex is a gate, not decoration: the tag names a version that can never be withdrawn, and
      # `npm version` accepts plenty of strings that are not the release you meant. A tag that is not
      # exactly vX.Y.Z stops here.
      - name: Take the version from the tag
        if: steps.channel.outputs.tag == 'latest'
        run: |
          set -euo pipefail
          # Anchored on the whole tag, so the `v` is required rather than merely tolerated, and each
          # component rejects a leading zero — `v01.2.3` is not semver, but `npm version` takes it and
          # publishes something nobody can install by the name they expect.
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z — a stable release takes its version from the tag"
            exit 1
          fi
          v="${GITHUB_REF_NAME#v}"
          npm version "$v" --no-git-tag-version --allow-same-version
          echo "publishing $v to the latest channel"

      # Inspect what actually ships before it ships — `files` is dist/ only, so a stray path in the
      # tarball listing is the signal that something leaked into the package.
      - name: Inspect the tarball
        run: npm pack --dry-run

      - name: Publish to npmjs
        run: npm publish --tag ${{ steps.channel.outputs.tag }} --provenance --access public
